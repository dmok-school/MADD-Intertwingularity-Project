<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflections</title>
<style>
:root{
  --bg:#0b1324; --tile:#1d3566; --grout:#2d4b82; --frame:#070d1a; --ink:#d9e2f2; --muted:#8293b3;
  --panel:rgba(7,13,26,.82); --glow:#9fc3ff; --data:#bfe0ff;
  color-scheme: dark;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#c9d3e6; --panel:rgba(232,238,248,.9); --ink:#0f1a30; --muted:#43557a; --glow:#2f5fb8; --data:#16305e; color-scheme: light; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Verdana,Tahoma,sans-serif;font-size:13px;overflow:hidden}
.page{position:fixed;inset:0;display:none}
.page.on{display:block}
a{color:var(--glow)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--muted);padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--glow)}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}

/* ---------- homepage ---------- */
#home svg{width:100%;height:100%;display:block;background:#1b3263}
.hot{cursor:pointer;transition:filter .3s, opacity .3s}
.hot:hover{filter:brightness(1.7) drop-shadow(0 0 12px #9fc3ff)}
.hot.soon{cursor:help}
.hot.soon:hover{filter:brightness(1.25)}

/* ---------- first reflection ---------- */
#reflection{background-color:#1d3566}
#refWall{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#reflection::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, transparent 30%, rgba(3,6,14,.75) 100%);pointer-events:none}
#wall{position:absolute;inset:0;pointer-events:none;z-index:1}
.qtile{position:absolute;width:142px;min-height:70px;padding:6px;font-size:10px;line-height:1.35;color:var(--data);background:rgba(10,20,44,.72);border:1px solid #3b5d99;opacity:0;transform:scale(.6);transition:opacity .6s, transform .6s}
.qtile.in{opacity:1;transform:scale(1)}
.qtile b{display:block;font-weight:400;font-size:11.5px;color:#fff;margin-bottom:3px}
@media (prefers-color-scheme: light){ .qtile{background:rgba(232,238,248,.85);border-color:#6f8fca} .qtile b{color:#0f1a30} }

#stage{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(380px,70vw);aspect-ratio:4/5;perspective:1100px;z-index:2}
#turner{position:absolute;inset:0;transform-style:preserve-3d;cursor:grab}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face svg{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}

#hud{position:absolute;top:14px;right:14px;z-index:3;background:var(--panel);padding:12px 14px;min-width:230px;line-height:1.7;border:1px solid #2d4b82}
#hud .big{font-size:22px;font-family:"Courier New",monospace}
#hud .zero{color:#ff8a8a}
#status{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;background:var(--panel);padding:10px 16px;max-width:min(640px,92vw);text-align:center;line-height:1.55;min-height:2.6em}
#back{position:absolute;top:14px;left:14px;z-index:3}
#searchbar{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;width:min(560px,92vw)}
#searchbar .lbl{color:#cfe0ff;font-weight:bold;font-size:12px;white-space:nowrap}
@media (prefers-color-scheme: light){ #searchbar .lbl{color:#0f1a30} }
#searchbar .box{flex:1;background:#fff;color:#000;border:2px inset #c8c8c8;padding:4px 7px;font-size:14px;min-height:28px;white-space:nowrap;overflow:hidden}
#searchbar .caret{display:inline-block;width:1px;height:1em;background:#000;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#searchbar .go{background:linear-gradient(#fdfdfd,#d6d6d6);color:#000;border:1px solid #8a8a8a;border-radius:3px;padding:4px 12px;font-size:12px}
#searchbar .go.pressed{background:linear-gradient(#cfcfcf,#f2f2f2)}
.qtile.fly{transition:left .9s cubic-bezier(.3,.7,.2,1), top .9s cubic-bezier(.3,.7,.2,1), opacity .4s, transform .9s}
#deeper{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);z-index:3;display:none}
#status:empty{display:none}

@media (prefers-reduced-motion: reduce){ .qtile{transition:none} }
</style>
</head>
<body>

<!-- =====================================================
     HOMEPAGE: rough placeholder for Danny's painting
     ===================================================== -->
<section class="page" id="home" aria-label="Homepage: the bathroom mirror">
  <svg id="homeArt" viewBox="0 0 1456 812" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A girl in a blue-tiled bathroom takes a mirror selfie with a flip phone. Behind her, reflections recede into the mirror, each one stranger than the last.">
    <defs>
      <!-- fine grime and speckle over the whole painting -->
      <filter id="grain" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4" stitchTiles="stitch"/>
        <feColorMatrix type="matrix" values="0 0 0 0 .03  0 0 0 0 .06  0 0 0 0 .14  0 0 0 1.3 -.45"/>
      </filter>
      <!-- large soft blotches, like worn glaze -->
      <filter id="mottle" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="4" seed="11"/>
        <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .68  0 0 0 0 .95  0 0 0 1.4 -.62"/>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation=".6"/></filter>
      <linearGradient id="glassShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0a1633" stop-opacity=".18"/><stop offset="1" stop-color="#050b1c" stop-opacity=".5"/>
      </linearGradient>
      <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#cfe0ff" stop-opacity=".06"/><stop offset=".5" stop-color="#cfe0ff" stop-opacity="0"/><stop offset=".55" stop-color="#cfe0ff" stop-opacity=".04"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="vignette" cx=".45" cy=".45" r=".75">
        <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#01030a" stop-opacity=".55"/>
      </radialGradient>
      <pattern id="tilesFace" width="7" height="7" patternUnits="userSpaceOnUse">
        <rect width="7" height="7" fill="#2b4b86"/><path d="M0 0 H7 M0 0 V7" stroke="#0b1530" stroke-width="1.2"/>
      </pattern>
      <clipPath id="clipGlass"><rect x="152" y="72" width="1164" height="431"/></clipPath>
      <clipPath id="clipA"><rect x="682" y="97" width="614" height="296"/></clipPath>
      <clipPath id="clipRoom"><rect x="109" y="42" width="1232" height="696"/></clipPath>
    </defs>

    <!-- the real wall -->
    <g id="wallTiles"></g>

    <!-- outer frame: the reflected room -->
    <rect x="105" y="38" width="1240" height="704" fill="none" stroke="#050912" stroke-width="7"/>
    <g clip-path="url(#clipRoom)"><g id="roomTiles"></g><rect x="109" y="42" width="1232" height="696" fill="#071025" opacity=".22"/></g>

    <!-- the mirror glass -->
    <rect x="146" y="66" width="1176" height="443" fill="#060a14"/>
    <g clip-path="url(#clipGlass)">
      <g id="glassTiles"></g>
      <g id="sideWall"></g>
      <rect x="152" y="72" width="1164" height="431" fill="url(#glassShade)"/>

      <!-- nested mirrors -->
      <rect x="676" y="91" width="626" height="308" fill="#05080f"/>
      <g clip-path="url(#clipA)"><g id="aTiles"></g><rect x="682" y="97" width="614" height="296" fill="#040916" opacity=".42"/></g>
      <rect x="697" y="108" width="587" height="188" fill="none" stroke="#05080f" stroke-width="6"/>
      <rect x="745" y="116" width="535" height="176" fill="#0a1328" opacity=".55"/>
      <rect x="922" y="126" width="360" height="118" fill="#03060d"/>
      <rect x="930" y="132" width="346" height="106" fill="#0b1630"/>
      <g id="deepTiles"></g>
      <rect x="930" y="132" width="346" height="106" fill="#02040b" opacity=".45"/>

      <!-- deepest reflection: Arya (abstract) -->
      <g class="hot soon" id="arya">
        <rect x="1196" y="134" width="80" height="104" fill="transparent"/>
        <g id="aryaShape" opacity=".8"></g>
      </g>
      <!-- eye-bar reflection -->
      <g opacity=".78" id="eyebar"></g>
      <!-- long-haired reflection -->
      <g opacity=".8" id="longhair"></g>
      <!-- middle reflection: Ishaan (face replaced by tiles) -->
      <g class="hot soon" id="ishaan"></g>
      <!-- first reflection: Sophia (back of the head) -->
      <g class="hot" id="toFirst" tabindex="0" role="link" aria-label="Enter the first reflection"></g>

      <rect x="152" y="72" width="1164" height="431" fill="url(#sheen)" style="pointer-events:none"/>
    </g>

    <!-- the sink below the mirror: Danny -->
    <g class="hot soon" id="sink"></g>

    <!-- the girl herself -->
    <g id="girl"></g>

    <!-- foreground: a second phone screen held up to the viewer -->
    <g id="foreground"></g>

    <!-- texture passes -->
    <rect width="1456" height="812" filter="url(#mottle)" opacity=".16" style="mix-blend-mode:screen;pointer-events:none"/>
    <rect width="1456" height="812" filter="url(#grain)" opacity=".18" style="pointer-events:none"/>
    <rect width="1456" height="812" fill="url(#vignette)" style="pointer-events:none"/>
  </svg>
</section>


<!-- =====================================================
     SUBPAGE: the first reflection (Sophia)
     ===================================================== -->
<section class="page" id="reflection" aria-label="The first reflection">
  <svg id="refWall" aria-hidden="true"></svg>
  <div id="wall"></div>
  <a href="index.html"><button id="back">&larr; Back to the mirror</button></a>

  <div id="hud" aria-live="polite">
    <div>Times you tried to turn her</div>
    <div class="big" id="tries">0</div>
    <div>Times you saw her face</div>
    <div class="big zero" id="faces">0</div>
  </div>

  <div id="stage">
    <div id="turner" tabindex="0" role="button" aria-label="The reflection, facing away. Hover, click, or press Enter to try to turn her around.">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
  </div>

  <div id="searchbar" aria-hidden="true"><span class="lbl">AOL Search</span><span class="box"><span id="typed"></span><span class="caret"></span></span><span class="go" id="go">Search</span></div>
  <div id="status" aria-live="polite"></div>
  <button id="deeper">Go deeper</button>
</section>

<!-- shared texture and shading definitions for the subpage (kept rendered so both sides of the figure can use them) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="refGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .03  0 0 0 0 .06  0 0 0 0 .14  0 0 0 1.3 -.45"/>
    </filter>
    <filter id="refMottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008" numOctaves="4" seed="19"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .68  0 0 0 0 .95  0 0 0 1.4 -.62"/>
    </filter>
  </defs>
</svg>

<!-- the back of her head: used on BOTH sides of the figure, so no angle ever shows a face.
     The figure is now the painted art_assets/unflippable.png; the typed search text is layered on top. -->
<template id="figureArt">
  <svg viewBox="0 0 400 500" aria-hidden="true">
    <image href="art_assets/unflippable.png" x="0" y="0" width="400" height="500" preserveAspectRatio="xMidYMax meet"/>
    <text x="200" y="384" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#7f93bd" letter-spacing="2">AnonID 10288049</text>
    <g class="headData" opacity="0">
      <rect x="118" y="96" width="164" height="128" rx="10" fill="#071226" opacity=".55"/>
      <text class="hq" x="200" y="132" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#cfe6ff"></text>
      <text class="ht" x="200" y="206" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#9fc3ff"></text>
    </g>
  </svg>
</template>


<script>
/* ---------- homepage painting: tiles, cel-shaded figures and messy hair, drawn in code ---------- */
(function buildHome(){
  const NS = 'http://www.w3.org/2000/svg';
  let seed = 10288049;
  const R = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const el = (parent, tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const P = (parent, d, fill, extra = {}) => el(parent, 'path', Object.assign({d, fill}, extra));
  const g = id => document.getElementById(id);

  // glazed tiles: each one a slightly different blue, with a pale grout and a worn bevel
  function tiles(parent, x0, y0, w, h, size, light, sat, grout, skew = 0){
    el(parent, 'rect', {x: x0, y: y0, width: w, height: h, fill: grout});
    for (let y = y0; y < y0 + h; y += size) for (let x = x0 - size; x < x0 + w; x += size){
      const sx = x + (y - y0) * skew;
      const L = light + (R() - .5) * 5, S = sat + (R() - .5) * 8, H = 218 + (R() - .5) * 6;
      el(parent, 'rect', {x: sx + 2, y: y + 2, width: size - 3.4, height: size - 3.4, fill: `hsl(${H} ${S}% ${L}%)`});
      el(parent, 'path', {d: `M${sx + 3} ${y + size - 3} V${y + 3} H${sx + size - 3}`, fill: 'none', stroke: `hsl(${H} 60% ${L + 9}%)`, 'stroke-width': 1.3, opacity: .55});
      el(parent, 'path', {d: `M${sx + 3} ${y + size - 2.5} H${sx + size - 2.5} V${y + 3}`, fill: 'none', stroke: `hsl(${H} 50% ${L - 7}%)`, 'stroke-width': 1.2, opacity: .6});
      if (R() < .25) el(parent, 'rect', {x: sx + 4 + R() * (size - 16), y: y + 4 + R() * (size - 16), width: 4 + R() * 9, height: 3 + R() * 6, fill: `hsl(${H} 40% ${L + 6}%)`, opacity: .35});
    }
  }
  tiles(g('wallTiles'), 0, -4, 1456, 820, 52, 33, 52, '#5b79ad');
  tiles(g('roomTiles'), 109, 40, 1232, 700, 46, 29, 48, '#47649a');
  tiles(g('glassTiles'), 152, 70, 1164, 436, 40, 20, 45, '#2a426f');
  tiles(g('aTiles'), 682, 95, 614, 300, 30, 15, 42, '#1d3157');
  tiles(g('deepTiles'), 930, 130, 346, 110, 22, 11, 40, '#14233f');

  // the side wall in the top-left of the glass, tiles bending into perspective
  const sw = g('sideWall');
  P(sw, 'M152 72 L640 72 L660 98 L152 300 Z', '#0f1d3c', {opacity: .55});
  for (let i = 0; i <= 9; i++){ const y = 72 + i * 26; el(sw, 'path', {d: `M152 ${y} L660 ${98 - (98 - 72) * (i / 9) * .2 + i * 1.5}`, stroke: '#3d5b92', 'stroke-width': 1.2, opacity: .22, fill: 'none'}); }
  for (let i = 0; i < 14; i++){ const x = 152 + Math.pow(i / 13, .8) * 500; el(sw, 'path', {d: `M${x} 72 L${x + 4} ${300 - (x - 152) * .41}`, stroke: '#3d5b92', 'stroke-width': 1.1, opacity: .2, fill: 'none'}); }

  // messy hair: a dark mass plus many tapered strands and a few blue-white highlights
  function strand(parent, rx, ry, tx, ty, w, fill, bend = 0){
    const mx = (rx + tx) / 2 + bend, my = (ry + ty) / 2;
    P(parent, `M${rx - w/2} ${ry} Q${mx - w/3} ${my} ${tx} ${ty} Q${mx + w/3} ${my} ${rx + w/2} ${ry} Z`, fill);
  }
  function hairArc(parent, cx, cy, rx, ry, a0, a1, n, lenMin, lenMax, wMin, wMax, fill, spread = .25){
    for (let i = 0; i < n; i++){
      const a = a0 + (a1 - a0) * (i + R() * .8) / n, x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
      const len = lenMin + R() * (lenMax - lenMin), out = Math.cos(a) * spread * len;
      strand(parent, x, y, x + out + (R() - .5) * 18, y + len, wMin + R() * (wMax - wMin), fill, (R() - .5) * 20);
    }
  }
  function flyaways(parent, cx, cy, r, n, color){
    for (let i = 0; i < n; i++){
      const a = -Math.PI * (.15 + R() * .7), x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * .9;
      const ex = x + Math.cos(a) * (6 + R() * 14) + (R() - .5) * 16, ey = y + Math.sin(a) * (4 + R() * 10) + 6;
      el(parent, 'path', {d: `M${x} ${y} Q${(x + ex) / 2 + (R() - .5) * 20} ${(y + ey) / 2 - 10} ${ex} ${ey}`, stroke: color, 'stroke-width': .9 + R(), fill: 'none', 'stroke-linecap': 'round'});
    }
  }
  function shine(parent, pts, color, op = .8){ pts.forEach(([x, y, w, rot]) => P(parent, `M${x} ${y} q${w * .5} ${-w * .25} ${w} 0 q${-w * .5} ${w * .12} ${-w} 0 Z`, color, {opacity: op, transform: `rotate(${rot} ${x} ${y})`})); }

  /* ---- the girl ---- */
  const G = g('girl');
  P(G, 'M262 300 C246 190 300 116 372 114 C452 114 500 180 488 300 L478 420 L270 420 Z', '#101217');            // back hair
  hairArc(G, 372, 255, 110, 130, Math.PI * .55, Math.PI * .98, 12, 120, 210, 14, 26, '#121419', .18);
  hairArc(G, 372, 255, 112, 130, Math.PI * .02, Math.PI * .45, 12, 120, 205, 14, 26, '#121419', .18);
  // everything below is traced in the painting's own pixel space, then scaled to fit
  const T = 'matrix(1.148 0 0 1.14 0 0)';
  const C = {skin: '#7a7e8c', skinLt: '#868a98', skinSh: '#6a6e7c', skinDp: '#545866', line: '#1c1f27',
             shLt: '#a4afc3', shHi: '#b9c3d5', shMid: '#7f8aa0', shDk: '#6a7490'};
  const B = el(G, 'g', {transform: T});

  // neck, with the jaw's shadow falling across it
  P(B, 'M300 300 L347 296 L350 376 L298 376 Z', '#676b79');
  P(B, 'M296 304 C305 318 315 324 320 324 C330 323 341 315 350 302 L350 346 C335 354 312 354 297 342 Z', C.skinDp);
  P(B, 'M313 352 L331 350 L333 376 L312 376 Z', '#707482', {opacity: .85});

  // T-shirt: a mid tone, then flat light planes and hard-edged fold shadows on top
  P(B, 'M257 373 C275 365 292 368 300 372 C315 390 335 392 352 374 C375 372 410 372 437 377 C455 400 466 425 472 452 L433 495 L443 650 L257 650 Z', C.shMid);
  P(B, 'M257 380 C275 372 292 372 300 376 L298 400 L257 401 Z', C.shLt);
  P(B, 'M352 376 C380 374 410 374 437 380 C452 402 462 425 468 448 L420 470 L398 398 Z', C.shLt);
  P(B, 'M257 397 C290 392 340 388 387 390 L392 488 L360 484 L340 492 L313 491 L310 474 L290 484 L273 481 L257 474 Z', C.shLt);
  P(B, 'M300 398 C320 394 350 392 372 396 L366 420 C340 414 318 416 300 424 Z', C.shHi, {opacity: .7});
  P(B, 'M257 395 L307 420 L283 431 L257 417 Z', C.shMid);
  P(B, 'M340 403 L387 380 L403 387 L380 407 L350 413 Z', C.shMid);
  P(B, 'M380 392 L397 387 L392 487 L383 487 Z', C.shMid);
  P(B, 'M403 447 L463 440 L470 457 L417 478 L403 467 Z', C.shDk);
  P(B, 'M418 403 L433 397 L437 417 L423 418 Z', C.shMid);
  P(B, 'M440 384 C452 404 460 424 466 446 L452 446 C448 426 444 404 440 384 Z', C.shMid, {opacity: .8});
  // lower torso: darker cloth with pale creases running down it
  P(B, 'M315 510 L330 507 L327 588 L318 574 Z', C.shLt);
  P(B, 'M357 513 L373 510 L361 571 L350 581 Z', C.shLt);
  P(B, 'M383 557 L390 553 L398 601 L387 594 Z', C.shLt);
  P(B, 'M320 607 C334 602 352 601 363 603 L370 617 C356 616 340 617 327 621 Z', C.shLt);
  P(B, 'M403 497 L430 507 L434 574 L417 553 Z', '#8e99ae');
  P(B, 'M390 513 L437 527 L437 541 L397 528 Z', C.shLt, {opacity: .85});
  P(B, 'M300 520 L312 515 L306 600 L298 611 Z', C.shDk);
  P(B, 'M338 540 L348 530 L345 621 L336 631 Z', C.shDk);
  P(B, 'M405 600 L420 590 L428 646 L410 649 Z', C.shDk);
  P(B, 'M262 560 L285 545 L290 640 L268 650 Z', C.shDk, {opacity: .7});
  P(B, 'M375 625 L398 612 L402 650 L380 650 Z', '#8e99ae', {opacity: .8});
  // crew neck collar and the dark gap inside it
  P(B, 'M294 374 C306 388 338 388 350 374 L352 382 C338 398 306 398 292 382 Z', '#4f5361');
  P(B, 'M291 372 C304 388 340 390 353 372 L357 376 C343 396 303 396 288 377 Z', C.shHi);
  P(B, 'M433 495 L472 452', 'none', {stroke: C.shDk, 'stroke-width': 2});

  // forearm rising to the phone
  P(B, 'M436 470 C448 462 460 457 472 451 C484 445 492 440 497 432 L501 470 C503 510 500 545 492 565 C484 572 470 574 462 570 C455 555 448 530 441 505 Z', '#6a6e7b');
  P(B, 'M458 478 C464 474 470 472 475 470 C478 500 479 526 474 546 L466 549 C464 526 462 500 458 478 Z', '#878b96');
  P(B, 'M462 560 C470 566 484 566 492 560 L490 568 C482 574 470 574 462 568 Z', '#5a5e6a');
  // flip phone
  P(G, 'M504 320 H557 V500 H504 Z', '#37474a');
  P(G, 'M508 324 H553 V398 H508 Z', '#3f5154');
  P(G, 'M508 398 H553 V496 H508 Z', '#334144');
  P(G, 'M516 412 L531 392 L546 412 Z', 'none', {stroke: '#202a2c', 'stroke-width': 2});
  el(G, 'circle', {cx: 531, cy: 405, r: 7, fill: '#0f1416', stroke: '#5a6b6e', 'stroke-width': 2});

const rankOf = r => r[2].length ? r[2][0][0] : null;
const clickLine = r => r[2].length ? `clicked ${r[2].length} result${r[2].length > 1 ? 's' : ''}: ${r[2][0][1]}${r[2].length > 1 ? ' +' + (r[2].length - 1) : ''}` : 'no click';

/* ---------- simple two-page routing (#first-reflection is the subpage) ---------- */
function route(){
  const sub = location.hash === '#first-reflection';
  $('#home').classList.toggle('on', !sub);
  $('#reflection').classList.toggle('on', sub);
  document.title = sub ? 'the first reflection' : 'Reflections';
  if (sub){ drawRefWall(); layoutTiles(); }
}
addEventListener('hashchange', route);
$('#toFirst').addEventListener('click', () => location.hash = 'first-reflection');
$('#toFirst').addEventListener('keydown', e => { if (e.key === 'Enter') location.hash = 'first-reflection'; });


/* ---------- the figure: the back of her head on both sides ---------- */
const art = $('#figureArt');
/* glazed tile wall behind the reflection, matching the homepage */
function drawRefWall(){
  const NS = 'http://www.w3.org/2000/svg', svg = $('#refWall'), W = innerWidth, H = innerHeight, size = 72;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = '';
  let sd = 3; const R = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  mk('rect', {width: W, height: H, fill: '#4a679d'});
  for (let y = 0; y < H; y += size) for (let x = 0; x < W; x += size){
    const L = 24 + (R() - .5) * 5, S = 48 + (R() - .5) * 8, Hh = 218 + (R() - .5) * 6;
    mk('rect', {x: x + 2.5, y: y + 2.5, width: size - 4.5, height: size - 4.5, fill: `hsl(${Hh} ${S}% ${L}%)`});
    mk('path', {d: `M${x + 3.5} ${y + size - 4} V${y + 3.5} H${x + size - 4}`, fill: 'none', stroke: `hsl(${Hh} 60% ${L + 9}%)`, 'stroke-width': 1.5, opacity: .5});
    mk('path', {d: `M${x + 3.5} ${y + size - 3} H${x + size - 3} V${y + 3.5}`, fill: 'none', stroke: `hsl(${Hh} 50% ${L - 7}%)`, 'stroke-width': 1.4, opacity: .6});
    if (R() < .3) mk('rect', {x: x + 6 + R() * (size - 24), y: y + 6 + R() * (size - 24), width: 6 + R() * 14, height: 4 + R() * 9, fill: `hsl(${Hh} 40% ${L + 6}%)`, opacity: .3});
  }
  mk('rect', {width: W, height: H, filter: 'url(#refMottle)', opacity: .16, style: 'mix-blend-mode:screen'});
  mk('rect', {width: W, height: H, filter: 'url(#refGrain)', opacity: .22});
}

document.querySelectorAll('.face').forEach(f => f.appendChild(art.content.cloneNode(true)));

/* ---------- query tiles on the wall ---------- */
let spots = [];
function layoutTiles(){
  const W = innerWidth, H = innerHeight, box = $('#stage').getBoundingClientRect();
  spots = [];
  for (let y = 70; y < H - 150; y += 84) for (let x = 14; x < W - 156; x += 156){
    const overFigure = x + 142 > box.left - 20 && x < box.right + 20 && y + 70 > box.top - 10 && y < box.bottom + 10;
    const overHud = x + 142 > W - 260 && y < 170;
    if (!overFigure && !overHud) spots.push([x, y]);
  }
  // shuffle so data appears scattered
  for (let i = spots.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; }
  document.querySelectorAll('.qtile').forEach((t, i) => { const s = spots[i % spots.length]; t.style.left = s[0] + 'px'; t.style.top = s[1] + 'px'; });
}
addEventListener('resize', () => { if (location.hash === '#first-reflection'){ drawRefWall(); layoutTiles(); } });
function wrap(q, n){ const words = q.split(' '), lines = ['']; words.forEach(w => { const l = lines[lines.length-1]; if ((l + ' ' + w).trim().length > n) lines.push(w); else lines[lines.length-1] = (l + ' ' + w).trim(); }); return lines.slice(0, 4); }
const heads = () => document.querySelectorAll('.headData');
function writeHead(text, t, rank){
  const lines = wrap(text, 14);
  document.querySelectorAll('.hq').forEach(el => { el.innerHTML = ''; lines.forEach((ln, k) => { const ts = document.createElementNS('http://www.w3.org/2000/svg', 'tspan'); ts.setAttribute('x', 200); ts.setAttribute('dy', k ? 21 : 0); ts.textContent = ln; el.appendChild(ts); }); });
  document.querySelectorAll('.ht').forEach(el => el.textContent = t ? t + (rank ? '  #' + rank : '') : '');
}
function setHead(op){ heads().forEach(h => { h.style.transition = 'opacity .35s'; h.setAttribute('opacity', op); }); }
function phone(t){ document.querySelectorAll('.phoneScreen').forEach(p => p.setAttribute('fill', t ? '#9fd4ff' : '#24333a')); document.querySelectorAll('.phoneTime').forEach(p => p.textContent = t ? t.slice(11, 16) : ''); }

// a card leaves her head and flies to its tile on the wall
function fly(i){
  const r = ROWS[i], q = r[0], t = r[1];
  const box = $('#stage').getBoundingClientRect();
  const el = document.createElement('div'); el.className = 'qtile fly in';
  el.innerHTML = `<b></b>${t}<br><span class="cl"></span>`;
  el.querySelector('.cl').textContent = clickLine(r);
  // when the wall is full, the oldest card in that spot fades out
  const old = document.querySelector(`.qtile[data-spot="${i % spots.length}"]`);
  if (old){ old.style.opacity = 0; setTimeout(() => old.remove(), 600); }
  el.dataset.spot = i % spots.length;
  el.querySelector('b').textContent = q;
  el.style.left = (box.left + box.width/2 - 71) + 'px'; el.style.top = (box.top + box.height*.22) + 'px'; el.style.transform = 'scale(1.15)';
  $("#wall").appendChild(el);
  const s = spots[i % spots.length] || [20, 80];
  requestAnimationFrame(() => requestAnimationFrame(() => { el.style.left = s[0] + 'px'; el.style.top = s[1] + 'px'; el.style.transform = 'scale(1)'; }));
}

/* ---------- trying to turn her ---------- */
const turner = $('#turner');
let angle = 0, tries = 0, busy = false, shown = 0;

// each attempt picks one way of NOT showing her face
const MOVES = [
  {kind: 'flinch', say: n => `She starts to turn, then snaps back. Still the back of her head.`},
  {kind: 'flinch', say: n => `She gets halfway, then turns away again.`},
  {kind: 'full',   say: n => `She turned all the way around. You are still looking at the back of her head.`},
  {kind: 'flinch', say: n => `She refuses. You get another search instead of a face.`},
  {kind: 'full',   say: n => `Another full turn. The back of her head is on both sides.`},
  {kind: 'spin',   say: n => `She spins twice. There is no front to this reflection.`},
  {kind: 'full',   say: n => `She turns. Her back again.`}
];

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function typeQuery(q, total){
  const el = $('#typed'); el.textContent = '';
  const per = Math.max(25, total / Math.max(1, q.length));
  for (let k = 1; k <= q.length; k++){ el.textContent = q.slice(0, k); writeHead(q.slice(0, k)); await sleep(per); }
}
async function tryTurn(){
  if (busy) return;
  busy = true; tries++;
  $('#tries').textContent = tries;
  $('#faces').textContent = 0;               // never changes, no matter what
  const move = tries <= 6 ? MOVES[tries - 1] : MOVES[2 + Math.floor(Math.random() * 5)];
  const idx = (tries - 1) % ROWS.length, row = ROWS[idx], q = row[0], t = row[1], rank = rankOf(row), isNew = idx === shown;

  // the turn and the search happen together: as she turns, her search is typed
  // into the box AND across the back of her head, where her face should be
  let frames, dur = Math.max(1600, q.length * 75 + 500);
  if (move.kind === 'flinch'){ frames = [angle, angle + 62, angle + 70, angle]; }
  else if (move.kind === 'full'){ frames = [angle, angle + 180]; angle += 180; }
  else { frames = [angle, angle + 720]; angle += 720; dur += 600; }
  if (reduce) dur = 400;

  $('#status').textContent = '';
  writeHead(''); setHead(1); phone(t);
  const anim = turner.animate(frames.map(a => ({transform: `rotateY(${a}deg)`})), {duration: dur, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards'});
  await Promise.all([typeQuery(q, dur * .8), anim.finished]);
  turner.style.transform = `rotateY(${angle}deg)`; anim.cancel();

  writeHead(q, t, rank);
  $('#go').classList.add('pressed'); await sleep(160); $('#go').classList.remove('pressed');
  $('#status').textContent = move.say(tries) + `  She searched "${q}" at ${t.slice(11, 16)}.`;
  if (isNew){ fly(idx); shown++; }
  document.title = q;
  await sleep(900);
  setHead(0); phone(null);

  if (tries === 12) $('#deeper').style.display = 'block';   // the way on opens partway, the data keeps going
  if (shown === ROWS.length && isNew){
    const last = ROWS[ROWS.length - 1];
    $('#status').textContent = `You tried ${tries} times and read all ${ROWS.length} of her searches, ending with "${last[0]}." You never saw her face.`;
  }
  busy = false;
}
// a new attempt each time the cursor enters her, plus click, tap and keyboard
turner.addEventListener('mouseenter', tryTurn);
turner.addEventListener('click', tryTurn);
turner.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tryTurn(); } });
// link to the middle reflection (Ishaan's page) once it is published
const NEXT_PAGE = '';
$('#deeper').onclick = () => { if (NEXT_PAGE) location.href = NEXT_PAGE; };

route();
</script>
