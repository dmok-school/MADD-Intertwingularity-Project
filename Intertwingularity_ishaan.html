<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos</title>

  <style>
    body {
      background-color: #14213d;
      margin: 0;
      padding: 10px 0;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .phone {
      position: relative;
      width: min(400px, calc(44vh - 40px));
      background-color: #111;
      border: 10px solid #2b2f36;
      border-radius: 36px;
      overflow: hidden;
    }

    .top-bar {
      color: white;
      padding: 14px 16px 8px;
      font-size: 22px;
      font-weight: bold;
    }
    .top-bar small {
      display: block;
      font-size: 12px;
      font-weight: normal;
      color: #8e8e93;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    .grid a {
      display: block;
    }
    .grid img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
    }
    .grid .home-tile {
      grid-column: 1 / -1;
    }
    .grid .home-tile img {
      aspect-ratio: auto;
      height: auto;
    }

    .home-bar {
      height: 64px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .home-button {
      display: block;
      width: 40px;
      height: 40px;
      box-sizing: border-box;
      border: 3px solid #8e8e93;
      border-radius: 50%;
      transition: filter .3s, border-color .3s;
    }
    /* same hover as the rest of the site: brighten + blue glow */
    .home-button:hover,
    .home-button:focus-visible {
      border-color: #9fc3ff;
      filter: brightness(1.7) drop-shadow(0 0 12px #9fc3ff);
      outline: none;
    }

    .viewer {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 64px;
      background-color: #000;
      color: white;
      text-align: center;
    }
    .viewer:target {
      display: block;
    }
    .viewer img {
      width: 100%;
      margin-top: 50px;
      display: block;
      -webkit-box-reflect: below 2px linear-gradient(transparent 70%, rgba(255,255,255,0.3));
    }
    .viewer a {
      color: #0a84ff;
      text-decoration: none;
    }
    .viewer .close { position: absolute; top: 14px; left: 14px; font-size: 16px; }
    .viewer .prev, .viewer .next {
      position: absolute;
      bottom: 14px;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      line-height: 1;
    }
    .viewer .prev { left: 20px; }
    .viewer .next { right: 20px; }
    .viewer .caption {
      position: absolute;
      bottom: 28px;
      width: 100%;
      font-size: 13px;
      color: #8e8e93;
      pointer-events: none;
    }
  </style>
</head>
