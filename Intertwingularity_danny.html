<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Danny Reflection</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    perspective: 3000px;
}

#sink {
    position: absolute;
    width: 100%;
    height: 100%;

    object-fit: cover;
    transform-origin: center center;

    will-change: transform;
}

.home-link {
    position: absolute;

    top: -22%;

    width: 100%;
    height: 30%;

    cursor: pointer;
}

.home-link:hover {
    background: rgba(159,195,255,0.12);
    box-shadow: 0 0 20px #9fc3ff;
}
</style>
</head>

<body>

<div class="scene">

    <img id="sink" src="sink.png" alt="Sink">

    <a
        class="home-link"
        href="MADD draft Sophia.html"
        title="Return to Sophia"
    ></a>

</div>

<script>

const sink = document.getElementById('sink');

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;

document.addEventListener('mousemove', (e) => {

    const mx = (e.clientX / window.innerWidth) - 0.5;
    const my = (e.clientY / window.innerHeight) - 0.5;

    targetX = mx * 60;
    targetY = my * 40;

});

function animate() {

    currentX += (targetX - currentX) * 0.06;
    currentY += (targetY - currentY) * 0.06;

    sink.style.transform = `
        translate(${currentX}px, ${currentY}px)
        rotateY(${currentX * 0.25}deg)
        rotateX(${-currentY * 0.25}deg)
        scale(1.08)
    `;

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
